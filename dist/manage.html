<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>上传作品 · 个人视频作品集</title><link rel="stylesheet" href="styles.css"><script src="manage.js" defer></script>
<style>main{max-width:900px;margin:55px auto;padding:0 24px}h1{font-size:28px;font-weight:500}p{color:var(--muted);line-height:1.8;margin:16px 0 25px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:24px 0}.actions button,.file-picker{padding:13px 20px;border:1px solid var(--line);border-radius:4px;background:#242620;color:var(--text);font-size:14px;cursor:pointer}.actions button.primary{background:var(--accent);color:#111}button:disabled{opacity:.4;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr 170px;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}.row small{color:var(--muted)}.state{text-align:right;font-size:13px}progress{grid-column:1/-1;width:100%;height:5px;accent-color:var(--accent)}#notice{color:var(--accent);min-height:28px;white-space:pre-line}input[type=file]{max-width:100%;padding:12px 0}a{color:var(--accent)}@media(max-width:500px){.row{grid-template-columns:1fr 120px}}</style></head>
<body><main><h1>上传作品</h1><p>选择这 10 个作品的视频文件。已完成的作品会自动跳过；上传过程中请保持页面打开。</p>
<label for="files">选择视频（可多选）</label><br><input id="files" type="file" accept="video/mp4,.mp4,.MP4" multiple>
<div class="actions"><button id="start" class="primary" disabled>上传所选作品</button><button id="refresh">刷新状态</button><a href="/">查看作品集 →</a></div>
<p id="notice" role="status" aria-live="polite">正在连接…</p><div id="list"></div></main></body></html>
