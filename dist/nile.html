<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111210">
  <meta name="description" content="在线观看《尼罗秘语》。">
  <title>尼罗秘语 · 在线观看</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23111210'/%3E%3Cpath d='M25 17L47 32 25 47Z' fill='%23e46c45'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;background:#111210;color:#f0eee8}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:32px 20px}
    main{width:min(1120px,100%)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}
    .category{color:#e67951;font-size:12px;letter-spacing:.12em}h1{margin:10px 0 0;font-size:clamp(25px,4vw,36px);font-weight:500}
    .duration{color:#a4a59c;font-size:13px;font-variant-numeric:tabular-nums}.stage{background:#000;border:1px solid #34352f;border-radius:6px;overflow:hidden}
    video{display:block;width:100%;aspect-ratio:16/9;max-height:75dvh;object-fit:contain}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:#a4a59c}
    label{display:flex;align-items:center;gap:8px;cursor:pointer}input{accent-color:#e67951}a{color:inherit;text-decoration:none}a:hover{color:#f0eee8}
    button{color:#f0eee8;background:#282a24;border:1px solid #484b40;border-radius:4px;padding:9px 15px;font:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #e67951;outline-offset:4px}.feedback{min-height:38px;margin-top:14px;display:flex;align-items:center;gap:14px;color:#c3c4bb;font-size:13px}[hidden]{display:none!important}
    @media(max-width:600px){body{padding:24px 12px}header{margin-bottom:18px}footer{font-size:12px}}
  </style>
  <script defer src="vendor/hls.min.js"></script>
</head>
<body>
  <main>
    <header><div><span class="category">短剧 / 系列短视频</span><h1>尼罗秘语</h1></div><span class="duration">04:28</span></header>
    <div class="stage"><video id="video" controls controlslist="nodownload" playsinline preload="metadata" poster="posters/nile.jpg" aria-label="尼罗秘语视频播放器"></video></div>
    <footer><label><input id="loop" type="checkbox">循环播放</label><a href="/">查看全部作品 →</a></footer>
    <div class="feedback"><span id="status" role="status" aria-live="polite">正在准备视频…</span><button id="retry" hidden>重新加载</button></div>
    <noscript>请启用浏览器 JavaScript 后观看视频。</noscript>
  </main>
  <script>
  window.addEventListener('DOMContentLoaded', () => {
    'use strict';
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');
    let hls = null;
    let expiresAt = 0;
    let timer = null;
    let loading = null;
    let restoring = false;
    let wantPlay = false;
    let generation = 0;
    let lastRecovery = -Infinity;
    let restoreListener = null;
    const needsRefresh = () => Date.now() >= expiresAt - 60000;
    function fail() {
      status.textContent = '视频暂时无法载入，请检查网络后重试。';
      retry.hidden = false;
    }
    function play() {
      video.play().catch(error => {
        if (error.name === 'NotAllowedError') status.textContent = '点击播放器中的播放按钮即可观看。';
        else if (error.name !== 'AbortError') fail();
      });
    }
    function recover() {
      if (loading || restoring) return;
      if (Date.now() - lastRecovery < 30000) { fail(); return; }
      lastRecovery = Date.now();
      refresh(!video.paused);
    }
    function refresh(resume = false) {
      wantPlay = wantPlay || resume;
      if (loading) return loading;
      clearTimeout(timer);
      retry.hidden = true;
      status.textContent = '正在准备视频…';
      loading = (async () => {
        try {
          const response = await fetch('/api/video?action=playback&id=nile', {
            cache: 'no-store', signal: AbortSignal.timeout(30000)
          });
          const data = await response.json();
          if (!response.ok || !data.url || !(data.expiresIn > 0)) throw new Error('Playback unavailable');
          const position = video.ended ? 0 : (video.currentTime || 0);
          const rate = video.playbackRate;
          wantPlay = wantPlay || !video.paused;
          const current = ++generation;
          restoring = true;
          video.pause();
          hls?.destroy();
          hls = null;
          if (restoreListener) video.removeEventListener('loadedmetadata', restoreListener);
          video.removeAttribute('src');
          video.load();
          expiresAt = Date.now() + data.expiresIn * 1000;
          restoreListener = () => {
            if (current !== generation) return;
            if (position > 0) video.currentTime = Number.isFinite(video.duration) ? Math.min(position, Math.max(0, video.duration - 0.05)) : position;
            video.playbackRate = rate;
            restoring = false;
            status.textContent = '';
            const resumePlayback = wantPlay;
            wantPlay = false;
            if (resumePlayback) play();
          };
          video.addEventListener('loadedmetadata', restoreListener, { once: true });
          if (window.Hls?.isSupported()) {
            hls = new Hls({ maxBufferLength: 30, startPosition: position });
            hls.on(Hls.Events.ERROR, (_, info) => {
              if (current !== generation || !info.fatal) return;
              restoring = false;
              const code = info.response?.code;
              if (code === 401 || code === 403 || needsRefresh()) recover();
              else fail();
            });
            hls.loadSource(data.url);
            hls.attachMedia(video);
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = data.url;
            video.load();
          } else {
            throw new Error('Unsupported browser');
          }
          timer = setTimeout(() => {
            if (!video.paused && !document.hidden) refresh(true);
          }, Math.max(1000, data.expiresIn * 1000 - 60000));
        } catch (_) {
          restoring = false;
          fail();
        }
      })().finally(() => { loading = null; });
      return loading;
    }
    video.addEventListener('play', () => {
      if (!restoring && needsRefresh()) { video.pause(); refresh(true); }
    });
    video.addEventListener('playing', () => { status.textContent = ''; retry.hidden = true; });
    video.addEventListener('error', () => {
      if (restoring || loading || hls) return;
      if (needsRefresh()) recover(); else fail();
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && expiresAt && needsRefresh()) refresh(!video.paused);
    });
    window.addEventListener('pageshow', event => {
      if (event.persisted && needsRefresh()) refresh(!video.paused);
    });
    retry.addEventListener('click', () => refresh(true));
    document.getElementById('loop').addEventListener('change', event => { video.loop = event.target.checked; });
    refresh();
  });
  </script>
</body>
</html>
